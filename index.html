<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cali Reign Tour Vote</title>
  <script src="https://www.google.com/recaptcha/api.js?render=YOUR_RECAPTCHA_SITE_KEY_HERE"></script>
  <style>
    body { 
      font-family: 'Arial', sans-serif; 
      background: #000; 
      color: #fff; 
      padding: 20px; 
      max-width: 600px; 
      margin: 0 auto; 
      min-height: 100vh;
    }
    h1 { text-align: center; color: #ff69b4; margin-bottom: 10px; }
    p { text-align: center; line-height: 1.5; }
    label { display: block; margin: 18px 0 8px; font-weight: bold; }
    input, select { 
      width: 100%; 
      padding: 12px; 
      background: #111; 
      border: 1px solid #ff69b4; 
      color: #fff; 
      border-radius: 8px; 
      font-size: 16px;
      box-sizing: border-box;
    }
    button { 
      width: 100%; 
      padding: 16px; 
      background: #ff69b4; 
      border: none; 
      color: #000; 
      font-weight: bold; 
      font-size: 18px;
      margin-top: 30px; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    button:hover { background: #ff8bd4; }
    .payment { display: none; margin-top: 25px; }
    .qr { text-align: center; margin: 20px 0; }
    .qr p { margin: 15px 0 10px; font-size: 18px; }
    .qr img { 
      max-width: 300px; 
      width: 100%; 
      border: 3px solid #ff69b4; 
      border-radius: 12px; 
    }
    #status { 
      margin-top: 30px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 18px;
      min-height: 60px;
    }
  </style>
</head>
<body>
  <h1>Vote for Cali Reign's Next Tour City 👑✨</h1>
  <p>Every $5 sent = 1 vote. Send payment → fill this form → upload screenshot proof.</p>
  <p>We approve fast. Top city wins the show.</p>

  <form id="voteForm">
    <label>Name (optional)</label>
    <input type="text" id="name" placeholder="Your name">

    <label>Discord Handle (optional)</label>
    <input type="text" id="discord" placeholder="@username">

    <label>Email (required – we send your upload link here)</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label>City you're voting for</label>
    <input type="text" id="city" required placeholder="e.g. Atlanta, Miami, NYC">

    <label>Number of votes you're claiming ($5 each)</label>
    <input type="number" id="votes" min="1" required placeholder="1">

    <label>Payment method you used</label>
    <select id="payment" required>
      <option value="">Choose payment method...</option>
      <option value="cashapp">Cash App</option>
      <option value="venmo">Venmo</option>
      <option value="sol">Solana</option>
      <option value="eth">Ethereum</option>
      <option value="btc">Bitcoin</option>
    </select>

    <div id="paymentInfo" class="payment"></div>

    <button type="submit">Submit Vote Claim</button>
  </form>

  <div id="status"></div>

  <script>
    // Config
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxgXz2Bh1-75jaqd0JQFZJS2xBaqlKrDCeAX4Tc6h2n6nOJnwE4kd0Y3I-FqquXIOMGAg/exec';
    const SITE_KEY = 'YOUR_RECAPTCHA_SITE_KEY_HERE';

    const paymentInfo = document.getElementById('paymentInfo');
    const paymentSelect = document.getElementById('payment');

    const qrMap = {
      cashapp: "<div class='qr'><p>Cash App: $calireign</p><img src='cashapp-qr.png' alt='Cash App QR' onerror=\"this.style.display='none'; this.parentNode.innerHTML += '<p>(QR image loading... check back soon)</p>'\"></div>",
      venmo: "<div class='qr'><p>Venmo: @calireign</p><img src='venmo-qr.png' alt='Venmo QR' onerror=\"this.style.display='none'; this.parentNode.innerHTML += '<p>(QR image loading... check back soon)</p>'\"></div>",
      sol: "<div class='qr'><p>Solana: YOUR_SOL_ADDRESS_HERE</p><img src='sol-qr.png' alt='Solana QR' onerror=\"this.style.display='none'; this.parentNode.innerHTML += '<p>(QR image loading... check back soon)</p>'\"></div>",
      eth: "<div class='qr'><p>Ethereum: YOUR_ETH_ADDRESS_HERE</p><img src='eth-qr.png' alt='Ethereum QR' onerror=\"this.style.display='none'; this.parentNode.innerHTML += '<p>(QR image loading... check back soon)</p>'\"></div>",
      btc: "<div class='qr'><p>Bitcoin: YOUR_BTC_ADDRESS_HERE</p><img src='btc-qr.png' alt='Bitcoin QR' onerror=\"this.style.display='none'; this.parentNode.innerHTML += '<p>(QR image loading... check back soon)</p>'\"></div>"
    };

    paymentSelect.addEventListener('change', function() {
      const method = paymentSelect.value;
      paymentInfo.innerHTML = qrMap[method] || '';
      paymentInfo.style.display = method ? 'block' : 'none';
    });

    document.getElementById('voteForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      status.textContent = 'Submitting your votes...';

      const votesClaimed = parseInt(document.getElementById('votes').value);
      const amountDue = votesClaimed * 5;

      const data = {
        action: 'submitVote',
        name_optional: document.getElementById('name').value.trim(),
        discord_handle_optional: document.getElementById('discord').value.trim(),
        email: document.getElementById('email').value.trim(),
        city: document.getElementById('city').value.trim(),
        votes_claimed: votesClaimed,
        payment_method_selected: paymentSelect.value
      };

      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipJson = await ipRes.json();
        data.ip = ipJson.ip;
      } catch (_) {
        data.ip = 'unknown';
      }

      try {
        const response = await fetch(EXEC_URL, {
          method: 'POST',
          mode: 'cors',
          redirect: 'follow',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.submissionId) {
          status.innerHTML = `
            <p style="color:#0f8;">✨ Success! ✨</p>
            <p>Your Submission ID: <strong>${result.submissionId.substring(0,8).toUpperCase()}</strong></p>
            <p>You claimed <strong>${votesClaimed} votes</strong> ($${amountDue}) for <strong>${data.city}</strong></p>
            <p>Check your email for the screenshot upload link. We'll approve fast 💖</p>
          `;
          document.getElementById('voteForm').reset();
          paymentInfo.innerHTML = '';
          paymentInfo.style.display = 'none';
        } else {
          status.innerHTML = `<p style="color:#f66;">Error: ${result.error || 'Something went wrong'}</p>`;
        }
      } catch (err) {
        status.innerHTML = `<p style="color:#f66;">Network error – try again or DM us 💕<br>Details: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
