<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cali Reign — Tour Vote</title>
  <style>
    :root{
      --bg:#0b0b0f;
      --card:#141420;
      --stroke:rgba(255,255,255,.10);
      --muted:rgba(255,255,255,.70);
      --txt:#fff;
      --pink:#ff2da6;
      --danger:#ff245a;
      --ok:#00ffb0;
      --input:#0f0f18;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt);}
    .wrap{max-width:780px; margin:0 auto; padding:18px;}
    .card{background:var(--card); border:1px solid var(--stroke); border-radius:18px; padding:16px;}
    h1{margin:0 0 6px; font-size:22px;}
    p{margin:0 0 14px; color:var(--muted); line-height:1.45}
    .grid{display:grid; gap:12px; grid-template-columns:1fr;}
    @media(min-width:700px){ .grid.two{grid-template-columns:1fr 1fr;} }
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px;}
    input, select{
      width:100%;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:var(--input);
      color:var(--txt);
      padding:12px 12px;
      outline:none;
    }
    input::placeholder{color:rgba(255,255,255,.35)}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    .btn{
      border:none;
      border-radius:14px;
      padding:12px 14px;
      font-weight:800;
      cursor:pointer;
      background:var(--pink);
      color:#000;
    }
    .btn.secondary{
      background:transparent;
      border:1px solid var(--stroke);
      color:var(--txt);
    }
    .btn:disabled{opacity:.55; cursor:not-allowed}
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      border:1px solid var(--stroke);
      color:var(--muted);
    }
    .msg{
      margin-top:12px;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      display:none;
      overflow:auto;
    }
    .msg.ok{border-color:rgba(0,255,176,.25); background:rgba(0,255,176,.10)}
    .msg.err{border-color:rgba(255,36,90,.25); background:rgba(255,36,90,.10)}
    .small{font-size:12px; color:var(--muted)}
    .divider{height:1px; background:var(--stroke); margin:14px 0;}
    .footer{margin-top:10px; font-size:12px; color:rgba(255,255,255,.55)}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h1>Cali Reign — Tour Vote</h1>
        <span class="pill">$5 = 1 vote</span>
      </div>

      <p>
        Pick the next city Cali should visit. Submit your vote claim, then you’ll get an email with a link to upload your payment screenshot.
      </p>

      <form id="voteForm" class="grid">
        <div class="grid two">
          <div>
            <label for="email">Email (required)</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="city">City (required)</label>
            <input id="city" type="text" placeholder="e.g. Atlanta" required />
          </div>
        </div>

        <div class="grid two">
          <div>
            <label for="votes">Votes claimed (required)</label>
            <input id="votes" type="number" min="1" max="1000" step="1" value="1" required />
            <div class="small" id="amountLine" style="margin-top:6px;">Amount due: $5</div>
          </div>

          <div>
            <label for="payment">Payment method (optional)</label>
            <select id="payment">
              <option value="">Select…</option>
              <option value="CashApp">CashApp</option>
              <option value="Venmo">Venmo</option>
              <option value="SOL">SOL</option>
              <option value="ETH">ETH</option>
              <option value="BTC">BTC</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="grid two">
          <div>
            <label for="name">Name (optional)</label>
            <input id="name" type="text" placeholder="First name or nickname" />
          </div>
          <div>
            <label for="discord">Discord handle (optional)</label>
            <input id="discord" type="text" placeholder="name#1234 or @name" />
          </div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <button id="submitBtn" class="btn" type="submit">Submit vote claim</button>
          <button id="leaderBtn" class="btn secondary" type="button">View leaderboard</button>
          <span class="small" id="statusLine"></span>
        </div>

        <div id="ok" class="msg ok"></div>
        <div id="err" class="msg err"></div>

        <div class="footer">
          If you need to pay with another crypto, email <a href="mailto:voting@ifuckfans.com" style="color:#7bd3ff">voting@ifuckfans.com</a>.
        </div>
      </form>
    </div>
  </div>

  <script>
    // =========================
    // CONFIG — CHANGE THIS ONE LINE ONLY
    // =========================
    const EXEC_URL = "https://script.google.com/macros/s/AKfycbywL3IjYYXKwSG4DwpULVPu-xKN083DN1MlJ0ZY71ec1xGUeqmvakkw6Y3BwoKue_cdNw/exec"; // must end with /exec

    // Leaderboard endpoint (querystring routing)
    const LEADERBOARD_URL = EXEC_URL + "?page=leaderboard";

    // =========================
    // Helpers
    // =========================
    const $ = (id) => document.getElementById(id);
    const ok = $("ok"), err = $("err");
    const submitBtn = $("submitBtn");
    const statusLine = $("statusLine");
    const amountLine = $("amountLine");

    function show(el, html){
      ok.style.display = "none";
      err.style.display = "none";
      el.innerHTML = html;
      el.style.display = "block";
    }

    function esc(s){
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function dollars(n){
      const v = Number(n) || 0;
      return "$" + v.toFixed(0);
    }

    async function post(action, payload){
      // IMPORTANT: text/plain to avoid preflight
      const res = await fetch(EXEC_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload })
      });

      const text = await res.text();
      try { return JSON.parse(text); }
      catch { return { error: text }; }
    }

    // Optional: client IP (best-effort). If this fails, backend uses "unknown".
    async function bestEffortIp(){
      try{
        // Fast, no keys; if blocked, ignore.
        const r = await fetch("https://api.ipify.org?format=json", { cache:"no-store" });
        const j = await r.json();
        return j.ip || "unknown";
      }catch{
        return "unknown";
      }
    }

    // =========================
    // UI wiring
    // =========================
    $("votes").addEventListener("input", () => {
      const v = Math.max(1, Math.min(1000, parseInt($("votes").value || "1", 10)));
      $("votes").value = v;
      amountLine.textContent = "Amount due: " + dollars(v * 5);
    });

    $("leaderBtn").addEventListener("click", () => {
      window.open(LEADERBOARD_URL, "_blank", "noopener");
    });

    $("voteForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      ok.style.display = "none";
      err.style.display = "none";

      if (!EXEC_URL || EXEC_URL.includes("PASTE_YOUR")) {
        return show(err, `<b>Error:</b> You need to paste your Apps Script <code>/exec</code> URL into <code>EXEC_URL</code>.`);
      }

      const email = $("email").value.trim();
      const city = $("city").value.trim();
      const votes_claimed = parseInt($("votes").value || "1", 10);

      if (!email || !city || !votes_claimed) {
        return show(err, `<b>Error:</b> Please fill email, city, and votes.`);
      }

      submitBtn.disabled = true;
      statusLine.textContent = "Submitting…";

      const ip = await bestEffortIp();

      const payload = {
        email,
        city,
        votes_claimed,
        payment_method_selected: $("payment").value,
        name_optional: $("name").value.trim(),
        discord_handle_optional: $("discord").value.trim(),
        ip
      };

      const res = await post("submitVote", payload);

      submitBtn.disabled = false;
      statusLine.textContent = "";

      if (res && res.error) {
        return show(err, `<b>Error:</b><br><pre style="white-space:pre-wrap;margin:0">${esc(res.error)}</pre>`);
      }

      // success
      show(ok, [
        `<b>Submitted.</b> Check your email for the upload link.`,
        `<div class="small" style="margin-top:8px">If you don’t see it, check spam/promotions. You can submit again if needed.</div>`
      ].join(""));
      // gentle reset
      $("votes").value = 1;
      amountLine.textContent = "Amount due: $5";
    });
  </script>
</body>
</html>
