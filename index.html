<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cali Reign — Tour Vote</title>
  <style>
    :root{--bg:#0b0b0f;--card:#141420;--stroke:rgba(255,255,255,.10);--muted:rgba(255,255,255,.70);--txt:#fff;--pink:#ff2da6;--input:#0f0f18;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);}
    .wrap{max-width:780px;margin:0 auto;padding:18px;}
    .card{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:16px;}
    h1{margin:0 0 6px;font-size:22px;}
    p{margin:0 0 14px;color:var(--muted);line-height:1.45}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;}
    input,select{width:100%;border-radius:14px;border:1px solid var(--stroke);background:var(--input);color:var(--txt);padding:12px;}
    .grid{display:grid;gap:12px}
    @media(min-width:700px){.two{grid-template-columns:1fr 1fr;}}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .btn{border:none;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;background:var(--pink);color:#000;}
    .btn.secondary{background:transparent;border:1px solid var(--stroke);color:var(--txt);}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .msg{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--stroke);display:none;overflow:auto;}
    .ok{border-color:rgba(0,255,176,.25);background:rgba(0,255,176,.10)}
    .err{border-color:rgba(255,36,90,.25);background:rgba(255,36,90,.10)}
    .small{font-size:12px;color:var(--muted)}
    .divider{height:1px;background:var(--stroke);margin:14px 0;}
    .qrWrap{display:none;margin-top:10px;border:1px solid var(--stroke);border-radius:16px;padding:12px;background:rgba(255,255,255,.03)}
    .qrWrap img{max-width:280px;width:100%;border-radius:14px;border:1px solid var(--stroke);display:block}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Cali Reign — Tour Vote</h1>
      <p>$5 = 1 vote. Submit your claim, pay, then upload your screenshot. (We’ll email you the upload link too — but you can do it immediately.)</p>

      <form id="voteForm" class="grid">
        <div class="grid two">
          <div>
            <label>Email (required)</label>
            <input id="email" type="email" required placeholder="you@example.com" />
          </div>
          <div>
            <label>City (required)</label>
            <input id="city" type="text" required placeholder="e.g. Atlanta" />
          </div>
        </div>

        <div class="grid two">
          <div>
            <label>Votes claimed</label>
            <input id="votes" type="number" min="1" max="1000" step="1" value="1" required />
            <div class="small" id="amountLine" style="margin-top:6px;">Amount due: $5</div>
          </div>
          <div>
            <label>Payment method</label>
            <select id="payment">
              <option value="">Select…</option>
              <option value="CashApp">CashApp</option>
              <option value="Venmo">Venmo</option>
              <option value="SOL">SOL</option>
              <option value="ETH">ETH</option>
              <option value="BTC">BTC</option>
              <option value="Other">Other</option>
            </select>

            <div id="qrWrap" class="qrWrap">
              <div class="small" style="margin-bottom:8px;">Scan to pay:</div>
              <img id="qrImg" alt="Payment QR" />
              <div class="small" style="margin-top:8px;opacity:.9">Then you’ll upload your screenshot on the next screen.</div>
            </div>
          </div>
        </div>

        <div class="grid two">
          <div>
            <label>Name (optional)</label>
            <input id="name" type="text" placeholder="First name or nickname" />
          </div>
          <div>
            <label>Discord (optional)</label>
            <input id="discord" type="text" placeholder="@name or name#1234" />
          </div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <button id="submitBtn" class="btn" type="submit">Continue</button>
          <button id="leaderBtn" class="btn secondary" type="button">View leaderboard</button>
          <span class="small" id="statusLine"></span>
        </div>

        <div id="ok" class="msg ok"></div>
        <div id="err" class="msg err"></div>
      </form>

      <div class="small" style="margin-top:12px;opacity:.85">
        Need another crypto? Email <a href="mailto:voting@ifuckfans.com" style="color:#7bd3ff">voting@ifuckfans.com</a>.
      </div>
    </div>
  </div>

  <script>
    // CHANGE THIS ONE LINE ONLY
     const EXEC_URL = window.EXEC_URL || "https://script.google.com/macros/s/AKfycbywL3IjYYXKwSG4DwpULVPu-xKN083DN1MlJ0ZY71ec1xGUeqmvakkw6Y3BwoKue_cdNw/exec"; // must end with /exec
    
    const LEADERBOARD_URL = EXEC_URL + "?page=leaderboard";

    const qrMap = {
      "CashApp": "cashapp-qr.png",
      "Venmo": "venmo-qr.png",
      "SOL": "sol-qr.png",
      "ETH": "eth-qr.png",
      "BTC": "btc-qr.png"
    };

    const $ = (id) => document.getElementById(id);
    const ok = $("ok"), err = $("err");
    const submitBtn = $("submitBtn");
    const statusLine = $("statusLine");
    const amountLine = $("amountLine");
    const qrWrap = $("qrWrap");
    const qrImg = $("qrImg");

    function show(el, html){
      ok.style.display="none"; err.style.display="none";
      el.innerHTML = html;
      el.style.display="block";
    }

    function esc(s){
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    async function post(action, payload){
      const res = await fetch(EXEC_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload })
      });
      const text = await res.text();
      try { return JSON.parse(text); } catch { return { error: text }; }
    }

    $("votes").addEventListener("input", () => {
      const v = Math.max(1, Math.min(1000, parseInt($("votes").value || "1", 10)));
      $("votes").value = v;
      amountLine.textContent = "Amount due: $" + (v * 5);
    });

    $("payment").addEventListener("change", () => {
      const pm = $("payment").value;
      const file = qrMap[pm];
      if (file) {
        qrImg.src = file;          // expects png in repo root
        qrWrap.style.display = "block";
      } else {
        qrWrap.style.display = "none";
        qrImg.src = "";
      }
    });

    $("leaderBtn").addEventListener("click", () => window.open(LEADERBOARD_URL, "_blank", "noopener"));

    $("voteForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      ok.style.display="none"; err.style.display="none";

      if (!EXEC_URL || EXEC_URL.includes("PASTE_YOUR")) {
        return show(err, `<b>Error:</b> Paste your Apps Script <code>/exec</code> URL into <code>EXEC_URL</code>.`);
      }

      submitBtn.disabled = true;
      statusLine.textContent = "Submitting…";

      const payload = {
        email: $("email").value.trim(),
        city: $("city").value.trim(),
        votes_claimed: parseInt($("votes").value || "1", 10),
        payment_method_selected: $("payment").value,
        name_optional: $("name").value.trim(),
        discord_handle_optional: $("discord").value.trim()
      };

      const res = await post("submitVote", payload);

      submitBtn.disabled = false;
      statusLine.textContent = "";

      if (res.error) {
        return show(err, `<b>Error:</b><br><pre style="white-space:pre-wrap;margin:0">${esc(res.error)}</pre>`);
      }

      // Momentum: send them straight to upload, email still goes out as backup
      if (res.upload_url) {
        window.location.href = res.upload_url;
        return;
      }

      show(ok, `<b>Submitted.</b> Check your email for the upload link.`);
    });
  </script>
</body>
</html>
