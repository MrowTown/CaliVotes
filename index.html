<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote for Cali Reign's Tour!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.google.com/recaptcha/api.js?render=6LcJBEUsAAAAAE9HpIiE1XL0g5hQbo0A4sfaPMzn"></script> <!-- REPLACE WITH YOUR ACTUAL SITE KEY -->
  <style>
    body { background:#C8A2C8; color:#000; font-family:'Poppins',sans-serif; padding:20px; text-align:center; }
    h1 { color:#FF69B4; }
    input, select, button { 
      background:#FF69B4; color:#000; border:none; border-radius:8px; padding:12px; margin:8px 0; width:90%; max-width:400px; font-size:16px; 
    }
    button { background:#00FFFF; cursor:pointer; font-weight:bold; }
    #step1 { display:block; }
    #step2, #step3, #thanks { display:none; }
    .honeypot { display:none; }
    #paymentDetails img { max-width:300px; margin:20px 0; }
    a { color:#00FFFF; }
  </style>
</head>
<body>
  <h1>Vote for Cali's Tour City!</h1>

  <div id="step1">
    <input type="email" id="email" placeholder="Email (required)" required>
    <input type="text" id="name" placeholder="Name (optional)">
    <input type="text" id="discord" placeholder="Discord (optional)">
    <input type="text" id="city" list="cities" placeholder="City (type or select)" required>
    <datalist id="cities"></datalist>
    <input type="number" id="votes" min="1" max="1000" placeholder="Number of votes ($5 each)" required>
    <select id="paymentMethod" required>
      <option value="">Choose payment method</option>
      <option value="CashApp">CashApp</option>
      <option value="Venmo">Venmo</option>
      <option value="SOL">SOL (Crypto)</option>
      <option value="ETH">ETH (Crypto)</option>
      <option value="BTC">BTC (Crypto)</option>
    </select>
    <input class="honeypot" type="text" id="hp" tabindex="-1" autocomplete="off">
    <button onclick="submitDeclaration()">Submit Vote</button>
  </div>

  <div id="step2">
    <p id="invoiceText"></p>
    <div id="paymentDetails"></div>
    <p><a href="mailto:calireign@protonmail.com">Contact Cali for other crypto</a></p>
    <button onclick="showUpload()">I Paid – Upload Proof Now</button>
    <button onclick="later()">I'll upload later (check email)</button>
  </div>

  <div id="step3">
    <p>Upload your payment screenshot:</p>
    <input type="file" id="screenshot" accept="image/*" required>
    <button onclick="uploadNow()">Upload</button>
  </div>

  <div id="thanks">
    <h2>Thanks! Waiting for Cali to approve 💖</h2>
    <p>Your votes will appear on the leaderboard once verified.</p>
    <p><a href="leaderboard.html">View Leaderboard</a></p>
  </div>

  <script>
    const backendUrl = 'https://script.google.com/macros/s/AKfycbxgXz2Bh1-75jaqd0JQFZJS2xBaqlKrDCeAX4Tc6h2n6nOJnwE4kd0Y3I-FqquXIOMGAg/exec';

    const cities = [
      "New York City, New York","Los Angeles, California","Chicago, Illinois","Houston, Texas","Phoenix, Arizona","Philadelphia, Pennsylvania","San Antonio, Texas","San Diego, California","Dallas, Texas","San Jose, California","Austin, Texas","Jacksonville, Florida","Fort Worth, Texas","Columbus, Ohio","Indianapolis, Indiana","Charlotte, North Carolina","San Francisco, California","Seattle, Washington","Denver, Colorado","Oklahoma City, Oklahoma","Nashville, Tennessee","El Paso, Texas","Washington, D.C., District of Columbia","Boston, Massachusetts","Las Vegas, Nevada","Portland, Oregon","Detroit, Michigan","Louisville, Kentucky","Memphis, Tennessee","Baltimore, Maryland","Milwaukee, Wisconsin","Albuquerque, New Mexico","Fresno, California","Tucson, Arizona","Sacramento, California","Mesa, Arizona","Kansas City, Missouri","Atlanta, Georgia","Omaha, Nebraska","Raleigh, North Carolina","Miami, Florida","Long Beach, California","Virginia Beach, Virginia","Oakland, California","Minneapolis, Minnesota","Tulsa, Oklahoma","Bakersfield, California","Wichita, Kansas","Arlington, Texas","Aurora, Colorado","Tampa, Florida","New Orleans, Louisiana","Cleveland, Ohio","Anaheim, California","Honolulu, Hawaii","Henderson, Nevada","Stockton, California","Lexington, Kentucky","Corpus Christi, Texas","Riverside, California","Santa Ana, California","Orlando, Florida","Irvine, California","Cincinnati, Ohio","Newark, New Jersey","Saint Paul, Minnesota","Pittsburgh, Pennsylvania","Greensboro, North Carolina","St. Louis, Missouri","Lincoln, Nebraska","Plano, Texas","Anchorage, Alaska","Durham, North Carolina","Jersey City, New Jersey","Chandler, Arizona","Chula Vista, California","Buffalo, New York","North Las Vegas, Nevada","Gilbert, Arizona","Madison, Wisconsin","Reno, Nevada","Toledo, Ohio","Fort Wayne, Indiana","Lubbock, Texas","St. Petersburg, Florida","Laredo, Texas","Irving, Texas","Chesapeake, Virginia","Winston-Salem, North Carolina","Glendale, Arizona","Scottsdale, Arizona","Garland, Texas","Boise, Idaho","Norfolk, Virginia"
    ];
    const datalist = document.getElementById('cities');
    cities.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      datalist.appendChild(opt);
    });

    let submissionId = null;

    function submitDeclaration() {
      if (document.getElementById('hp').value) return; // honeypot

      const data = {
        action: 'submitVote',
        email: document.getElementById('email').value.trim(),
        name_optional: document.getElementById('name').value.trim(),
        discord_handle_optional: document.getElementById('discord').value.trim(),
        city: document.getElementById('city').value.trim(),
        votes_claimed: parseInt(document.getElementById('votes').value),
        payment_method_selected: document.getElementById('paymentMethod').value,
        ip: 'client'
      };

      grecaptcha.ready(() => {
        grecaptcha.execute('6LcJBEUsAAAAAE9HpIiE1XL0g5hQbo0A4sfaPMzn', {action: 'submit'}).then(token => { // REPLACE WITH YOUR SITE KEY
          data.recaptchaToken = token;
          fetch(backendUrl, {method: 'POST', body: JSON.stringify(data)})
            .then(r => r.json())
            .then(json => {
              if (json.error) return alert(json.error);
              submissionId = json.submissionId;
              localStorage.setItem('submissionId', submissionId);
              showInvoice(data);
            })
            .catch(() => alert('Connection issue – try again'));
        });
      });
    }

    function showInvoice(data) {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      const amount = data.votes_claimed * 5;
      document.getElementById('invoiceText').innerHTML = `Send <strong>$${amount}</strong> for <strong>${data.votes_claimed}</strong> votes to <strong>${data.city}</strong>`;

   let details = '';
switch (data.payment_method_selected) {
  case 'CashApp':
    details = '$yourmomwarnedyou <br><img src="cashapp-qr.png" alt="CashApp QR">'; 
    break;
  case 'Venmo':
    details = '@yourmomwarnedyou <br><img src="venmo-qr.png" alt="Venmo QR">'; 
    break;
  case 'SOL':
    details = 'GNA2U9vAetNriGAfeziZjZruJZ1xR9ZLYFSeJJsgZDWR <br><img src="sol-qr.png" alt="SOL QR">'; 
    break;
  case 'ETH':
    details = '0x016e552bdA243f69DA29b86041e911312fAFA95b <br><img src="eth-qr.png" alt="ETH QR">'; 
    break;
  case 'BTC':
    details = 'bc1q7chqcjg27yv0prm9n4lqzekp5exrwdllr9p2gq <br><img src="btc-qr.png" alt="BTC QR">'; 
    break;
}
document.getElementById('paymentDetails').innerHTML = details;
    }

    function showUpload() {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
    }

    function later() {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    }

    function uploadNow() {
      const file = document.getElementById('screenshot').files[0];
      if (!file) return alert('Select an image');
      const reader = new FileReader();
      reader.onload = e => {
        const payload = {
          action: 'uploadScreenshot',
          submissionId: submissionId || localStorage.getItem('submissionId'),
          imageBase64: e.target.result,
          mimeType: file.type
        };
        fetch(backendUrl, {method: 'POST', body: JSON.stringify(payload)})
          .then(r => r.json())
          .then(json => {
            if (json.success) {
              document.getElementById('step3').style.display = 'none';
              document.getElementById('thanks').style.display = 'block';
            } else alert(json.error || 'Upload failed');
          });
      };
      reader.readAsDataURL(file);
    }

    // Magic link support
    const params = new URLSearchParams(window.location.search);
    if (params.has('id')) {
      submissionId = params.get('id');
      localStorage.setItem('submissionId', submissionId);
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
    }
  </script>
</body>
</html>
